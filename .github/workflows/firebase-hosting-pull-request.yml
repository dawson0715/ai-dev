name: Deploy to Firebase Hosting (live)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_URL: "http://cs3-om0.oddmonitor.com/api"

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AI_DEV_AGENT_3F6CE }}
          projectId: ai-dev-agent-3f6ce
          channelId: live
          entryPoint: apps/web-ui
