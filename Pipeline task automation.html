\\"Git hosting platform\\\"]\\n\\nQuindi la configurazione diventa dinamica via API.\\n\\nCollection `projects`:\\n\\n```json id=\\\"6z1pjk\\\"\\n{\\n  \\\"_id\\\": \\\"project_id\\\",\\n\\n  \\\"name\\\": \\\"Backend API\\\",\\n\\n  \\\"clickup\\\": {\\n    \\\"list_id\\\": \\\"901234\\\"\\n  },\\n\\n  \\\"gitlab\\\": {\\n    \\\"url\\\": \\\"git@gitlab.com:company/backend-api.git\\\",\\n    \\\"token\\\": \\\"glpat-xxx\\\",\\n    \\\"default_branch\\\": \\\"main\\\"\\n  },\\n\\n  \\\"local_path\\\": \\\"/opt/computer/backend-api\\\",\\n\\n  \\\"agent\\\": {\\n    \\\"enabled\\\": true,\\n    \\\"stack\\\": \\\"node-fastify\\\"\\n  },\\n\\n  \\\"created_at\\\": \\\"...\\\"\\n}\\n```\\n\\nAPI:\\n\\n### Create project\\n\\n```http id=\\\"d9o7n8\\\"\\nPOST /projects\\n```\\n\\nBody:\\n\\n```json id=\\\"y2h87l\\\"\\n{\\n  \\\"name\\\": \\\"Backend API\\\",\\n  \\\"gitlab_url\\\": \\\"git@gitlab.com:company/backend-api.git\\\",\\n  \\\"gitlab_token\\\": \\\"glpat-xxx\\\",\\n  \\\"clickup_list_id\\\": \\\"901234\\\"\\n}\\n```\\n\\nFlow:\\n\\n```text id=\\\"mcn37u\\\"\\nPOST /projects\\n    ↓\\nsalva progetto Mongo\\n    ↓\\ngit clone\\n    ↓\\n/opt/computer/backend-api\\n```\\n\\nTi conviene usare:\\n\\n```text id=\\\"95r85m\\\"\\n/opt/computer/\u003cprojectId\u003e\\n```\\n\\nNON il nome progetto, così eviti:\\n- caratteri strani\\n- rename\\n- collisioni\\n\\nesempio:\\n\\n```text id=\\\"4v1mqs\\\"\\n/opt/computer/685af12c91d\\n```\\n\\nNel DB:\\n\\n```json id=\\\"5jk7hu\\\"\\n{\\n  \\\"local_path\\\": \\\"/opt/computer/685af12c91d\\\"\\n}\\n```\\n\\nPoi il worker gira continuamente:\\n\\n```text id=\\\"chsl2g\\\"\\nevery 30 sec:\\n  foreach enabled project:\\n    check clickup todo tasks\\n```\\n\\nOppure meglio:\\n- webhook ClickUp → enqueue job\\n- polling fallback ogni X minuti\\n\\nDato che tutte le liste hanno:\\n- stessi stati\\n- stessa struttura\\n\\npuoi standardizzare totalmente il flow.\\n\\nEsempio stati:\\n\\n```text id=\\\"f3j7dv\\\"\\nTodo\\nIn Progress\\nReview\\nDone\\nFailed\\n```\\n\\nFlow agente:\\n\\n```text id=\\\"qsp8ym\\\"\\nTODO\\n  ↓\\nworker prende task\\n  ↓\\nsetta:\\n\\\"In Progress\\\"\\n  ↓\\ngit pull\\n  ↓\\ncreate branch\\n  ↓\\nClaude coding\\n  ↓\\ncommit\\n  ↓\\npush\\n  ↓\\ncreate MR\\n  ↓\\ncommento ClickUp\\n  ↓\\nstatus:\\n\\\"Review\\\"\\n```\\n\\nCommento automatico task:\\n\\n```text id=\\\"2ehwqy\\\"\\n🤖 Merge Request creata\\n\\nBranch:\\nfeature/cu-123-login\\n\\nMR:\\nhttps://gitlab.com/...\\n```\\n\\nPer il repository locale:\\n\\nall’avvio worker:\\n\\n```text id=\\\"yk0byl\\\"\\nif repo missing:\\n  git clone\\n\\nelse:\\n  git fetch\\n  git reset --hard origin/main\\n```\\n\\nMolto importante:\\nusa SEMPRE worktree o clone separati per task.\\n\\nNON lavorare direttamente sulla copia principale.\\n\\nPattern corretto:\\n\\n```text id=\\\"61ehxq\\\"\\n/opt/computer/cache/project-a\\n/opt/computer/runs/job-123\\n```\\n\\nFlow:\\n\\n```text id=\\\"x0p4tm\\\"\\ncache repo aggiornato\\n   ↓\\ncp o git clone locale\\n   ↓\\nrun task isolato\\n```\\n\\noppure ancora meglio:\\n\\n```bash id=\\\"53z54m\\\"\\ngit worktree add\\n```\\n\\ncosì eviti:\\n- branch sporchi\\n- conflitti\\n- task concorrenti\\n\\nEsempio:\\n\\n```text id=\\\"kpjlwm\\\"\\n/opt/computer/worktrees/job-123\\n```\\n\\nTi consiglio questa struttura:\\n\\n```text id=\\\"k0gwgm\\\"\\n/apps/api\\n/apps/worker\\n\\n/opt/computer/cache\\n/opt/computer/worktrees\\n```\\n\\nPer Node:\\n\\n- urlsimple-githttps://github.com/steveukx/git-js\\n- urlFastifyhttps://fastify.dev/\\n\\nPer l’agente:\\n- Claude Code SDK\\noppure\\n- chiamate API dirette urlAnthropic API Docshttps://docs.anthropic.com/en/docs/\\n\\nTi conviene anche salvare:\\n\\n```json id=\\\"4xd1g9\\\"\\n{\\n  \\\"task_id\\\": \\\"CU-123\\\",\\n  \\\"project_id\\\": \\\"...\\\",\\n  \\\"status\\\": \\\"running\\\",\\n  \\\"branch\\\": \\\"feature/cu-123\\\",\\n  \\\"mr_url\\\": null,\\n  \\\"logs\\\": [],\\n  \\\"created_at\\\": \\\"...\\\",\\n  \\\"updated_at\\\": \\\"...\\\"\\n}\\n```\\n\\nPer una V1 è già un’architettura molto solida e relativamente semplice da operare in Docker Swarm.\",{},{\"_135\":492,\"_142\":634,\"_34\":635,\"_36\":636,\"_145\":637,\"_147\":148,\"_150\":151,\"_152\":638,\"_154\":155},\"49c85cac-cea5-44ed-b5dc-5bd73c6b7938\",[474],{\"_189\":320,\"_152\":646},1778790985.335675,1778791007.353325,{\"_184\":185,\"_186\":644},{\"_231\":14,\"_163\":639,\"_168\":640,\"_306\":641,\"_308\":642,\"_310\":14,\"_311\":14,\"_312\":14,\"_313\":14,\"_314\":14,\"_315\":643,\"_170\":505,\"_317\":-5,\"_174\":506,\"_167\":89,\"_179\":10,\"_177\":14},[],[],[],[],{},[645],\"Ok,\\nClickup accede a tutte le liste con lo stesso token\\n\\n quindi con un api si crea il progetto.\\nURL gitlab \\n token gitlab \\nLista clickup\\n\\nIl bacekdn scarica il repository in /opt/computer/\u003cprj\u003e\\n\\nPoi può partire L'agente se ci sono task in todo \\nLe liste clickup hanno tutte lo stesso formato e Stati \",{},{\"_135\":632,\"_142\":650,\"_34\":651,\"_145\":652,\"_147\":148,\"_149\":26,\"_150\":151,\"_152\":653,\"_154\":155,\"_156\":157},\"54399c1f-71d7-4267-b7ee-4808befe8eca\",[492],{\"_189\":190,\"_152\":681},1778790706.153702,{\"_184\":185,\"_186\":679},{\"_158\":654,\"_160\":26,\"_161\":655,\"_163\":656,\"_165\":657,\"_167\":89,\"_502\":658,\"_168\":659,\"_170\":660,\"_172\":173,\"_174\":661,\"_176\":89,\"_46\":47,\"_177\":26,\"_178\":648,\"_179\":10},{\"_30\":180,\"_181\":678},[],[],[],{\"_507\":662,\"_509\":663,\"_511\":664,\"_513\":665,\"_515\":666,\"_517\":667,\"_519\":668,\"_521\":669},[],\"7da13746-a8e1-47e6-a598-7a02bfbb5f9f\",\"305c54c3-8045-4677-85ad-754a9d27c195\",{\"_135\":677,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":676,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":675,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":674,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":673,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":672,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":671,\"_546\":14,\"_547\":14 em Prompt\\n```text\\nYou are a senior backend engineer...\\n```\\n\\n### User Prompt\\n```text\\nImplement JWT login endpoint...\\n```\\n\\n## Risposta Claude\\n```diff\\n+ const jwt = ...\\n```\\n\\n## Diff Git\\n```diff\\n+ app.post('/login')\\n```\\n\\n## Log esecuzione\\n```text\\ngit clone ...\\nnpm test ...\\ngit push ...\\n```\\n\\n---\\n\\nTi consiglio di salvare:\\n- prompt completi\\n- diff\\n- errori\\n- retry\\n- timing\\n\\nperché quando l’AI sbaglia è l’unico modo per capire il motivo.\\n\\nUI Svelte semplice:\\n\\n```text id=\\\"5hz8ef\\\"\\n/routes/jobs\\n/routes/jobs/[id]\\n```\\n\\nAPI:\\n\\n```text id=\\\"5fg3t9\\\"\\nGET /jobs\\nGET /jobs/:id\\nPOST /jobs/:id/retry\\nPOST /jobs/:id/cancel\\n```\\n\\nFeature molto utile:\\n- “Copy Prompt”\\n- “Replay Prompt”\\n\\ncosì puoi:\\n- testare prompt diversi\\n- confrontare modelli\\n- rigenerare patch\\n\\nPuoi anche salvare le versioni del prompt template:\\n\\n```json id=\\\"74hywe\\\"\\n{\\n  \\\"prompt_template_version\\\": \\\"v4\\\"\\n}\\n```\\n\\ncosì sai quale template produce risultati migliori.\\n\\nSecondo me la struttura migliore è:\\n\\n```text id=\\\"4l8q6s\\\"\\nagent-api\\nagent-worker\\nagent-backoffice\\n```\\n\\ntutti separati, ma condividono:\\n- MongoDB\\n- config repositories\\n\\nPer l’autenticazione del backoffice:\\n- GitLab OAuth\\noppure\\n- basic auth interna se siete pochi.\",{},{\"_135\":726,\"_142\":798,\"_34\":799,\"_145\":800,\"_147\":148,\"_150\":151,\"_152\":801,\"_154\":155},\"52dbb3bd-93f6-4f3b-a1cb-eb1d9b994636\",[710],{\"_189\":320,\"_152\":809},1778363484.846939,{\"_184\":185,\"_186\":807},{\"_231\":14,\"_163\":802,\"_168\":803,\"_306\":804,\"_308\":805,\"_310\":14,\"_311\":14,\"_312\":14,\"_313\":14,\"_314\":14,\"_315\":806,\"_170\":738,\"_317\":-5,\"_174\":739,\"_167\":89,\"_179\":10,\"_177\":14},[],[],[],[],{},[808],\"Crea anche una pagina dove vedo i prompt dei task eseguiti \",{},{\"_135\":796,\"_142\":813,\"_34\":814,\"_145\":815,\"_147\":148,\"_149\":26,\"_ n  /api\\n  /worker\\n  /shared\\n\\nMongo collections:\\n- jobs\\n- repositories\\n- executions\\n- ai_logs\\n```\\n\\nEsempio collection jobs:\\n\\n```json\\n{\\n  \\\"_id\\\": \\\"...\\\",\\n  \\\"type\\\": \\\"clickup_task\\\",\\n  \\\"status\\\": \\\"pending\\\",\\n  \\\"clickup_task_id\\\": \\\"abc123\\\",\\n  \\\"clickup_list_id\\\": \\\"999\\\",\\n  \\\"gitlab_project_id\\\": \\\"backend/api\\\",\\n  \\\"branch\\\": null,\\n  \\\"mr_url\\\": null,\\n  \\\"created_at\\\": \\\"...\\\",\\n  \\\"started_at\\\": null,\\n  \\\"completed_at\\\": null,\\n  \\\"error\\\": null\\n}\\n```\\n\\nWebhook semplice:\\n\\n```js\\nfastify.post('/webhooks/clickup', async (req, reply) =\u003e {\\n  const event = req.body\\n\\n  if (event.event !== 'taskCreated') {\\n    return reply.send({ ok: true })\\n  }\\n\\n  await db.jobs.insertOne({\\n    type: 'clickup_task',\\n    status: 'pending',\\n    clickup_task_id: event.task_id,\\n    clickup_list_id: event.list_id,\\n    created_at: new Date()\\n  })\\n\\n  return reply.send({ ok: true })\\n})\\n```\\n\\nWorker:\\n\\n```js\\nwhile (true) {\\n  const job = await db.jobs.findOneAndUpdate(\\n    { status: 'pending' },\\n    {\\n      $set: {\\n        status: 'running',\\n        started_at: new Date()\\n      }\\n    }\\n  )\\n\\n  if (!job) {\\n    await sleep(3000)\\n    continue\\n  }\\n\\n  await processJob(job)\\n}\\n```\\n\\nPer evitare race condition:\\n\\n```js\\nfindOneAndUpdate(\\n  { status: 'pending' },\\n  { $set: { status: 'running' } }\\n)\\n```\\n\\nè già sufficiente.\\n\\nFlow completo:\\n\\n```text\\nClickUp task\\n   ↓\\nWebhook\\n   ↓\\nMongo job\\n   ↓\\nWorker\\n   ↓\\nRecupera mapping repo\\n   ↓\\nClone repo\\n   ↓\\nClaude analizza task\\n   ↓\\nGenera modifiche\\n   ↓\\nfeature/clickup-123\\n   ↓\\ncommit\\n   ↓\\npush\\n   ↓\\ncreate MR\\n   ↓\\nClickUp → \\\"in progress\\\"\\n```\\n\\nPer Git in Node:\\n\\n- urlsimple-githttps://github.com/steveukx/git-js\\n- oppure shell commands con `execa`\\n\\nPer GitLab API:\\n- urlGitLab REST APIhttps://docs.gitlab.com/ee/api/\\n\\nPer Claude:\\n- urlAnthropic API Docshttps://docs.anthropic.com/en/docs/\\n\\nUna cosa importante: usa sempre una working directory temporanea per job:\\n\\n```text\\n/tmp/agents/{jobId}\\n```\\n\\ncosì puoi:\\n- fare cleanup\\n- isolare branch\\n- evitare conflitti\\n\\nTi conviene anche salvare:\\n- prompt inviato\\n- diff generata\\n- output AI\\n- token usage\\n- log git\\n\\nin MongoDB per audit/debug.\\n\\nSecondo me, senza RabbitMQ hai:\\n- meno complessità\\n- meno moving parts\\n- deploy più semplice in Docker Swarm\\n- meno problemi operativi\\n\\ne per un sistema AI-agent è spesso la scelta migliore all’inizio.\",{},{\"_135\":811,\"_142\":893,\"_34\":894,\"_145\":895,\"_147\":148,\"_150\":151,\"_152\":896,\"_154\":155},\"b8ce249f-35e9-4204-be30-71abaf5d8e72\",[796],{\"_189\":320,\"_152\":904},1778363388.830185,{\"_184\":185,\"_186\":902},{\"_231\":14,\"_163\":897,\"_168\":898,\"_306\":899,\"_308\":900,\"_310\":14,\"_311\":14,\"_312\":14,\"_313\":14,\"_314\":14,\"_315\":901,\"_170\":823,\"_317\":-5,\"_174\":824,\"_167\":89,\"_179\":10,\"_177\":14},[],[],[],[],{},[903],\"Si sempre feature branch e mr. Codice anche in node va bene. Senza rmq?\",{},{\"_135\":891,\"_142\":908,\"_34\":909,\"_145\":910,\"_147\":148,\"_149\":26,\"_150\":151,\"_152\":911,\"_154\":155,\"_156\":157},\"5e0f13b8-a324-4b35-8f8a-ff6d782557dd\",[811],{\"_189\":190,\"_152\":957},1778363210.769309,{\"_184\":185,\"_186\":955},{\"_158\":912,\"_160\":26,\"_161\":913,\"_163\":914,\"_165\":915,\"_167\":89,\"_502\":916,\"_168\":917,\"_170\":918,\"_172\":173,\"_174\":919,\"_176\":89,\"_46\":47,\"_177\":26,\"_178\":906,\"_179\":10},{\"_30\":180,\"_181\":954},[],[932,933,934],[],{\"_507\":920,\"_509\":921,\"_511\":922,\"_513\":923,\"_515\":924,\"_517\":925},[],\"af5b495c-6b3e-48eb-9b50-77026f4f4db7\",\"dff04b3e-5f3e-433e-b328-59133be3b9c0\",{\"_135\":931,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":930,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":929,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":928,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":927,\"_546\":14,\"_547\":14,\"_548\":-5},{\"_135\":926,\"_546\":14,\"_547\":14,\"_548\":-5},\"h2iwck\",\"h1anf2\",\"n2gcwn\",\"o4p0m1\",\"hc9371\",\"j3h7d9\",{\"_572\":618,\"_574\":-5,\"_575\":949,\"_577\":950,\"_42\":951,\"_580\":952,\"_582\":623,\"_584\":623,\"_30\":605,\"_200\":623,\"_606\":607,\"_608\":151,\"_152\":-5,\"_609\":-5,\"_610\":953,\"_147\":612,\"_613\":-5,\"_614\":-5,\"_135\":625},{\"_572\":940,\"_574\":-5,\"_575\":941,\"_577\":942,\"_42\":943,\"_580\":944,\"_582\":945,\"_584\":945,\"_30\":605,\"_200\":945,\"_606\":607,\"_608\":151,\"_152\":-5,\"_609\":-5,\"_610\":946,\"_147\":612,\"_613\":-5,\"_614\":-5,\"_135\":947},{\"_572\":599,\"_574\":-5,\"_575\":935,\"_577\":936,\"_42\":937,\"_580\":938,\"_582\":604,\"_584\":604,\"_30\":605,\"_200\":604,\"_606\":607,\"_608\":151,\"_152\":-5,\"_609\":-5,\"_610\":939,\"_147\":612,\"_613\":-5,\"_614\":-5,\"_135\":615},348,400,[],[],{\"_616\":617},\"entity[\\\"company\\\",\\\"Anthropic\\\",\\\"Claude AI\\\"]\",248,292,[],[],\"Anthropic\",{\"_616\":948},\"6DIKCrIKUPvtJSnk\",\"Claude AI\",122,182,[],[],{\"_616\":626},[183],[956],\"Puoi strutturarlo come una pipeline “event-driven” abbastanza semplice e robusta:\\n\\n1. Il cliente crea/aggiorna un task su entity[\\\"company\\\",\\\"ClickUp\\\",\\\"project management platform\\\"]  \\n2. Un worker intercetta l’evento webhook  \\n3. L’agente AI (es. entity[\\\"company\\\",\\\"Anthropic\\\",\\\"Claude AI\\\"]) analizza il task  \\n4. Clona il repository corretto da entity[\\\"company\\\",\\\"GitLab\\\",\\\"Git hosting platform\\\"]  \\n5. Genera/modifica codice  \\n6. Crea branch + commit  \\n7. Apre Merge Request  \\n8. Aggiorna stato task ClickUp → “Work in Progress”\\n\\nLa parte chiave è il mapping `clickup_list -\u003e gitlab_repo`.\\n\\nTi conviene avere:\\n\\n```yaml\\n# config/projects.yml\\n\\nprojects:\\n  - clickup_list_id: \\\"901234567\\\"\\n    gitlab:\\n      project_id: \\\"backend/api\\\"\\n      default_branch: \\\"main\\\"\\n      ssh_key: \\\"/keys/backend_rsa\\\"\\n    ai:\\n      language: \\\"python\\\"\\n      framework: \\\"fastapi\\\"\\n\\n  - clickup_list_id: \\\"901234568\\\"\\n    gitlab:\\n      project_id: \\\"frontend/webapp\\\"\\n      default_branch: \\\"master\\\"\\n      ssh_key: \\\"/keys/frontend_rsa\\\"\\n    ai:\\n      language: \\\"typescript\\\"\\n      framework: \\\"svelte\\\"\\n```\\n\\nArchitettura consigliata:\\n\\n```text\\nClickUp Webhook\\n        |\\n        v\\nWebhook API (FastAPI/Fastify)\\n        |\\n        v\\nRabbitMQ Queue\\n        |\\n        v\\nAI Worker\\n   ├── legge config mapping\\n   ├── trova repo GitLab\\n   ├── clone repo\\n   ├── genera codice via Claude\\n   ├── commit\\n   ├── push branch\\n   ├── crea MR\\n   └── aggiorna task ClickUp\\n```\\n\\nNel tuo caso, dato che già usi:\\n- Docker Swarm\\n- RabbitMQ\\n- FastAPI/Fastify\\n- MongoDB\\n\\nla soluzione naturale è:\\n\\n- API webhook → FastAPI\\n- Coda → RabbitMQ\\n- Worker AI separato\\n- Persistenza stato → MongoDB\\n\\nFlusso concreto:\\n\\n```text\\nTask ClickUp:\\n\\\"Implementare endpoint login JWT\\\"\\n\\n↓\\n\\nWebhook ricevuto\\n\\n↓\\n\\nWorker:\\n- recupera task\\n- legge lista ClickUp\\n- trova repo associato\\n- genera branch:\\n  feature/clickup-123-login-jwt\\n\\n↓\\n\\nClaude riceve prompt:\\n- task title\\n- descrizione\\n- struttura repository\\n- coding rules\\n\\n↓\\n\\nClaude produce patch\\n\\n↓\\n\\ngit commit -m \\\"feat(auth): add JWT login endpoint\\\"\\n\\n↓\\n\\nPush\\n\\n↓\\n\\nCreazione Merge Request GitLab\\n\\n↓\\n\\nTask ClickUp:\\nstatus = \\\"work in progress\\\"\\ncomment = \\\"MR creata: !42\\\"\\n```\\n\\nPer il mapping puoi anche usare MongoDB invece di YAML se vuoi modificarlo dinamicamente:\\n\\n```json\\n{\\n  \\\"clickup_list_id\\\": \\\"901234567\\\",\\n  \\\"gitlab_project_id\\\": \\\"backend/api\\\",\\n  \\\"default_branch\\\": \\\"main\\\",\\n  \\\"ssh_key\\\": \\\"/keys/backend_rsa\\\",\\n  \\\"rules\\\": {\\n    \\\"framework\\\": \\\"fastapi\\\",\\n    \\\"language\\\": \\\"python\\\"\\n  }\\n}\\n```\\n\\nAPI che probabilmente ti servono:\\n\\n### ClickUp\\n- webhook events\\n- get task\\n- update task status\\n- add comment\\n\\n### GitLab\\n- create branch\\n- create merge request\\n- add labels\\n- assign reviewers\\n\\n### Claude\\n- analyze task\\n- generate patch/diff\\n- explain changes\\n\\nTi consiglio anche di separare:\\n\\n- `planner-agent`\\n  - analizza task\\n  - produce piano\\n\\n- `coder-agent`\\n  - genera codice\\n\\n- `review-agent`\\n  - controlla qualità/lint/test\\n\\nPer evitare commit “distruttivi”.\\n\\nUn dettaglio importante: non fare mai eseguire commit direttamente dall’AI sul branch principale. Sempre:\\n\\n```text\\ntask -\u003e feature branch -\u003e MR\\n```\\n\\ne possibilmente:\\n- lint\\n- unit test\\n- dry-run CI\\n\\nprima di aprire la MR.\\n\\nPer la gestione concorrente, dato che hai già esperienza con RabbitMQ e worker sequenziali, puoi usare:\\n\\n```text\\nrouting_key = gitlab_project_id\\n```\\n\\ncosì i task dello stesso repository vengono serializzati ed eviti conflitti Git.\",{},{\"_135\":906,\"_142\":961,\"_34\":962,\"_145\":963,\"_147\":148,\"_150\":151,\"_152\":964,\"_154\":155},\"bbb21634-d862-4593-bfb6-bff05ce2a88f\",[891],{\"_189\":190,\"_152\":965},1778363210.7717237,{\"_184\":282,\"_283\":233},{\"_179\":10,\"_281\":26},{},{\"_135\":959,\"_142\":969,\"_34\":970,\"_145\":971,\"_147\":148,\"_150\":151,\"_152\":972,\"_154\":155},\"ca306e9d-cb11-41d7-bb01-2024db48e6ac\",[906],{\"_189\":320,\"_152\":980},1778363210.607828,{\"_184\":185,\"_186\":978},{\"_231\":14,\"_163\":973,\"_168\":974,\"_306\":975,\"_308\":976,\"_310\":14,\"_311\":14,\"_312\":14,\"_313\":14,\"_314\":14,\"_315\":977,\"_170\":918,\"_317\":-5,\"_174\":919,\"_167\":89,\"_179\":10,\"_177\":14},[],[],[],[],{},[979],\"Il cliente scrive i task su click up
